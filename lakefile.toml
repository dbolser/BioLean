name = "BioLean"
version = "0.1.0"
defaultTargets = ["BioLean"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "BioLean"

[[lean_lib]]
name = "BioLeanLib"
roots = ["BioLean.Lib.GLP1", "BioLean.Examples.Ozempic", "BioLean.Lib.Textbook", "BioLean.Examples.Textbook", "BioLean.Examples.Quantity", "BioLean.Examples.Context", "BioLean.Examples.Chemiosmosis", "BioLean.Tests.RO", "BioLean.Tests.Context", "BioLean.Tests.IsA"]

[[lean_lib]]
name = "TextbookR2"
roots = ["BioLean.Lib.TextbookClaimsR2.Entities", "BioLean.Lib.TextbookClaimsR2.CellStructureAndFunction",
  "BioLean.Lib.TextbookClaimsR2.HowCellsObtainEnergy", "BioLean.Lib.TextbookClaimsR2.MolecularBiology",
  "BioLean.Lib.TextbookClaimsR2.Photosynthesis", "BioLean.Lib.TextbookClaimsR2.ReproductionAtTheCellularLevel",
  "BioLean.Lib.TextbookClaimsR2.TheBodySSystemsA", "BioLean.Lib.TextbookClaimsR2.TheBodySSystemsB",
  "BioLean.Lib.TextbookClaimsR2.TheCellularBasisOfInheritance", "BioLean.Examples.Closure"]
